spring.application.name=mcm-onboarding

# Railway PORT
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mcm_onboarding?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AI
# ngrok
ai.chat.base-url=${AI_CHAT_BASE_URL:https://overprice-trimming-quickstep.ngrok-free.dev}

# SSE — ChatHarnessService의 SseEmitter(180_000L)과 값 일치시킴 (AI RAG 서버가 60~120초대로
# 걸리는 질문이 있어 상향; SseEmitter 생성자 타임아웃이 이 값보다 우선 적용되므로 실제로는
# SseEmitter 쪽 값이 유효 타임아웃이다 — 혼동 방지를 위해 같은 값으로 맞춤)
spring.mvc.async.request-timeout=180000

# Admin
admin.api-key=${ADMIN_KEY}

# QR
app.qr.url-template=${QR_URL_TEMPLATE:{tagCode}}

# CORS — 프론트 배포 도메인. 여러 개면 쉼표로 구분.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha