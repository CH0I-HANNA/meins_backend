spring.application.name=mcm-onboarding

# Railway PORT
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mcm_onboarding?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# LLM (OpenAI)
llm.api.base-url=${LLM_API_BASE_URL:https://api.openai.com/v1}
llm.api.key=${LLM_API_KEY:}

# SSE
spring.mvc.async.request-timeout=120000

# Admin
admin.api-key=${ADMIN_KEY}

# QR
app.qr.url-template=${QR_URL_TEMPLATE:{tagCode}}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha